name: build-audio
on: workflow_dispatch
env:
  FINALPACKAGE: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: brew install xcbeautify ldid-procursus p7zip make
      - uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive
      - name: SDK
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos-roothide
          cd theos-roothide
          ./bin/install-sdk iPhoneOS16.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.2"
      - name: build
        run: |
          source devkit/bootstrap.sh
          FINALPACKAGE=1 gmake clean package
      - uses: actions/upload-artifact@v4
        with:
          name: tvnc-tipa
          path: packages/*.tipa
          if-no-files-found: error
